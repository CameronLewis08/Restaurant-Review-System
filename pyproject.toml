[project]
name = "restaurant-reviews"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restaurant_reviews"]

[tool.pytest.ini_options]
addopts = "--cov=restaurant_reviews --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "src/restaurant_reviews/main.py",
    "src/restaurant_reviews/schemas.py",
    "src/restaurant_reviews/app.py",
]